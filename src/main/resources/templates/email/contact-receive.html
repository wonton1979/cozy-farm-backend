<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>New Cozy Farm Message</title>
</head>

<body
        style="
        margin: 0;
        padding: 0;
        background-color: #efe8d8;
        font-family: Arial, Helvetica, sans-serif;
    "
>

<table
        role="presentation"
        width="100%"
        cellpadding="0"
        cellspacing="0"
        border="0"
        style="background-color: #efe8d8;"
>
    <tr>
        <td
                align="center"
                style="padding: 32px 16px;"
        >

            <!-- EMAIL CARD -->
            <table
                    role="presentation"
                    width="600"
                    cellpadding="0"
                    cellspacing="0"
                    border="0"
                    style="
                    width: 600px;
                    max-width: 100%;
                    background-color: #fffaf0;
                    border-radius: 18px;
                    overflow: hidden;
                    color: #3f4938;
                "
            >

                <!-- HEADER ART -->
                <tr>
                    <td style="padding: 0;">
                        <img
                                src="https://res.cloudinary.com/wonton79/image/upload/v1788105226/cozy_farm_email_header_tau0d0.png"
                                alt="Cozy Farm"
                                width="600"
                                style="
                                display: block;
                                width: 100%;
                                max-width: 600px;
                                height: auto;
                                border: 0;
                            "
                        >
                    </td>
                </tr>


                <!-- TITLE -->
                <tr>
                    <td
                            align="center"
                            style="
                            padding: 30px 32px 8px 32px;
                        "
                    >
                        <h1
                                style="
                                margin: 0;
                                font-size: 24px;
                                line-height: 1.3;
                                color: #49613d;
                            "
                        >
                            New Message from Cozy Farm
                        </h1>
                    </td>
                </tr>


                <!-- INTRO -->
                <tr>
                    <td
                            style="
                            padding: 14px 36px 8px 36px;
                            font-size: 15px;
                            line-height: 1.7;
                            color: #4d5148;
                        "
                    >
                        Hello Jerry &amp; Jane,
                        <br><br>
                        Someone has left a new message through the
                        Cozy Farm contact form.
                    </td>
                </tr>


                <!-- VISITOR DETAILS -->
                <tr>
                    <td style="padding: 18px 36px 8px 36px;">

                        <table
                                role="presentation"
                                width="100%"
                                cellpadding="0"
                                cellspacing="0"
                                border="0"
                                style="
                                background-color: #f4eddc;
                                border: 1px solid #ddd2b9;
                                border-radius: 12px;
                            "
                        >
                            <tr>
                                <td
                                        style="
                                        padding: 18px 20px;
                                        font-size: 14px;
                                        line-height: 1.7;
                                    "
                                >
                                    <strong
                                            style="color: #61764f;"
                                    >
                                        From
                                    </strong>

                                    <br>

                                    <span
                                            style="
                                            font-size: 17px;
                                            font-weight: bold;
                                            color: #3d4937;
                                        "
                                    >
                                        {{visitorName}}
                                    </span>

                                    <br>

                                    <a
                                            href="mailto:{{visitorEmail}}"
                                            style="
                                            color: #6b7d5d;
                                            text-decoration: none;
                                        "
                                    >
                                        {{visitorEmail}}
                                    </a>
                                </td>
                            </tr>
                        </table>

                    </td>
                </tr>


                <!-- MESSAGE TITLE -->
                <tr>
                    <td
                            style="
                            padding: 22px 36px 8px 36px;
                            font-size: 15px;
                            font-weight: bold;
                            color: #61764f;
                        "
                    >
                        Message
                    </td>
                </tr>


                <!-- MESSAGE -->
                <tr>
                    <td style="padding: 0 36px 30px 36px;">

                        <table
                                role="presentation"
                                width="100%"
                                cellpadding="0"
                                cellspacing="0"
                                border="0"
                                style="
                                background-color: #ffffff;
                                border: 1px solid #e2dac8;
                                border-radius: 12px;
                            "
                        >
                            <tr>
                                <td
                                        style="
                                        padding: 20px;
                                        font-size: 15px;
                                        line-height: 1.75;
                                        color: #454940;
                                    "
                                >
                                    {{message}}
                                </td>
                            </tr>
                        </table>

                    </td>
                </tr>


                <!-- FOOTER ART -->
                <tr>
                    <td style="padding: 0;">
                        <img
                                src="https://res.cloudinary.com/wonton79/image/upload/v1788106111/cozy_farm_email_footer_xab35x.png"
                                alt=""
                                width="600"
                                style="
                                display: block;
                                width: 100%;
                                max-width: 600px;
                                height: auto;
                                border: 0;
                            "
                        >
                    </td>
                </tr>


                <!-- WEBSITE FOOTER -->
                <tr>
                    <td
                            align="center"
                            style="
                            padding: 18px 30px 26px 30px;
                            background-color: #465b3c;
                            font-size: 12px;
                            line-height: 1.6;
                            color: #e9eddf;
                        "
                    >
                        Jerry &amp; Jane's Cozy Farm
                        <br>

                        <a
                                href="https://www.jerry-jane.co.uk"
                                style="
                                color: #ffffff;
                                text-decoration: none;
                            "
                        >
                            jerry-jane.co.uk
                        </a>
                    </td>
                </tr>

            </table>
            <!-- /EMAIL CARD -->

        </td>
    </tr>
</table>

</body>
</html>
